      const communityDetails = {"Downtown":{"Population":"High","Income":"High","Race":"Mixed","Life stage":"Younger adults","Housing":"Renters","Transport":"Oasis","Employment":"Hub","Land use":"Commercial","Landmarks":"Business, Retail, Entertainment"},"Airport":{"Population":"Medium","Income":"Low","Race":"Mixed","Life stage":"Mixed","Housing":"Renters","Transport":"Some","Employment":"Hub","Land use":"Industrial","Landmarks":"Airport"},"Retail and Entertainment Center":{"Population":"High","Income":"High","Race":"Mostly white","Life stage":"Younger adults","Housing":"Renters","Transport":"Some","Employment":"Hub","Land use":"Commercial","Landmarks":"Business, Retail, Entertainment"},"Popular Urban Residence with Shops":{"Population":"Medium","Income":"High","Race":"Mostly white","Life stage":"Mixed ages","Housing":"Mixed","Transport":"Oasis","Employment":"Balance","Land use":"Mixed","Landmarks":"Retail, Entertainment"},"Underdeveloped Neighborhood":{"Population":"Medium","Income":"Low","Race":"Mostly hispanic","Life stage":"Families","Housing":"Mixed","Transport":"Desert","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Airport, Schools"},"Affluent Suburban Neighborhood":{"Population":"Medium","Income":"High","Race":"Mostly white","Life stage":"Families","Housing":"Owners","Transport":"Oasis","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Schools, Parks"},"University":{"Population":"High","Income":"Low","Race":"Mixed","Life stage":"Younger adults","Housing":"Renters","Transport":"Oasis","Employment":"Hub","Land use":"Mixed","Landmarks":"University Hospital"},"Rural-Suburban Outskirts":{"Population":"Medium","Income":"Medium","Race":"Mixed","Life stage":"Families","Housing":"Owners","Transport":"Some","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Schools, Parks"},"Gentrifying Neighborhood":{"Population":"Medium","Income":"Medium","Race":"Mixed","Life stage":"Mixed ages","Housing":"Mixed","Transport":"Some","Employment":"Balance","Land use":"Mixed","Landmarks":"Parks, Schools"},"Lower-Income Urban Neighborhood":{"Population":"High","Income":"Low","Race":"Mostly hispanic","Life stage":"Families","Housing":"Mixed","Transport":"Desert","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Schools, Parks"},"Industrial Center":{"Population":"Low","Income":"Low","Race":"Mixed","Life stage":"Mixed","Housing":"Renters","Transport":"Desert","Employment":"Hub","Land use":"Industrial","Landmarks":"Factory"},"Mixed Urban Community":{"Population":"High","Income":"Low","Race":"Mixed","Life stage":"Families","Housing":"Renters","Transport":"Some","Employment":"Balance","Land use":"Mixed","Landmarks":"School, Business"},"Historic Black Neighborhood":{"Population":"Medium","Income":"Medium","Race":"Mostly Black","Life stage":"Mixed ages","Housing":"Mixed","Transport":"Some","Employment":"Balance","Land use":"Mixed","Landmarks":"Schools, Parks"},"International District":{"Population":"Medium","Income":"Medium","Race":"Mostly Asian","Life stage":"Families","Housing":"Mixed","Transport":"Some","Employment":"Balance","Land use":"Mixed","Landmarks":"Schools, Business"},"Retirement Community":{"Population":"Low","Income":"Medium","Race":"Mixed","Life stage":"Mostly older adults","Housing":"Owners","Transport":"Some","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Hospital, Parks"},"Quiet Rural Low-Income Community":{"Population":"Low","Income":"Low","Race":"Mixed","Life stage":"Families","Housing":"Mixed","Transport":"Desert","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Schools"},"Working-Class Homeowner Neighborhood":{"Population":"Medium","Income":"Low","Race":"Mostly Hispanic","Life stage":"Families","Housing":"Owners","Transport":"Some","Employment":"Balance","Land use":"Residential","Landmarks":"Schools"},"New High-Density Development":{"Population":"High","Income":"Medium","Race":"Mixed","Life stage":"Younger adults","Housing":"Renters","Transport":"Some","Employment":"Balance","Land use":"Mixed","Landmarks":"Retail"},"Suburban Tech Campus":{"Population":"Low","Income":"High","Race":"Mixed","Life stage":"Younger adults","Housing":"Renters","Transport":"Some","Employment":"Hub","Land use":"Commercial","Landmarks":"Business"},"Exurban Commuter Town":{"Population":"Medium","Income":"Medium","Race":"Mixed","Life stage":"Families","Housing":"Owners","Transport":"Desert","Employment":"Few local jobs","Land use":"Residential","Landmarks":"Schools, Parks"}};

      const principleLabels = {
        equal: 'Equal',
        utilitarian: 'Utilitarian',
        sufficientarian: 'Sufficientarian',
        prioritarian: 'Prioritarian',
        proportional: 'Proportional'
      };

      // Proportional was implemented, run and then measured to be unexpressible
      // in this network, so it has no solved data. It stays on the switcher as a
      // finding rather than being dropped silently.
      const DATA_PRINCIPLES = new Set(['equal', 'utilitarian', 'sufficientarian', 'prioritarian']);

      const priorityOptions = [
        { label: 'Low income', key: 'low_income' },
        { label: 'People of color', key: 'people_of_color' },
        { label: 'Transit deserts', key: 'transit_desert' },
        { label: 'Few nearby jobs', key: 'few_jobs' }
      ];

      const principleGuidance = {
        equal: {
          goal: 'Routes will be designed to keep the added noise as similar as possible across communities.',
          tradeoff: 'Exactly equal is impossible, so the model needs an agreed threshold for what counts as similar.'
        },
        utilitarian: {
          goal: 'Routes will be designed to produce the lowest combined modeled burden across all communities.',
          tradeoff: 'A lower total can still place much more burden on one community, so the most efficient route may be uneven.'
        },
        sufficientarian: {
          goal: 'Routes will be designed so no community’s added-noise change exceeds an agreed maximum.',
          tradeoff: 'The maximum itself requires a defensible judgment, and differences between communities below the maximum are not considered.'
        },
        prioritarian: {
          goal: 'Routes will be designed to give additional protection to communities facing a selected existing burden, barrier, or risk. Protection here means fewer routes flying overhead — it does not change which communities can use UAM service.',
          tradeoff: 'The priority condition needs clear evidence and justification, and protecting one community may redirect noise toward others.'
        },
        proportional: {
          goal: 'Routes would be designed so the burden a community receives is related to the practical UAM benefits it can receive.',
          tradeoff: 'On this map the principle cannot be carried out at all — see the explanation on the right. That result is itself a finding, not a gap in the data.'
        }
      };

      const el = {
        steps: root.querySelector('#wf-steps'),
        kicker: root.querySelector('#wf-kicker'),
        title: root.querySelector('#wf-title'),
        copy: root.querySelector('#wf-copy'),
        badge: root.querySelector('#wf-screen-badge'),
        screen: root.querySelector('#wf-screen'),
        back: root.querySelector('#wf-back'),
        next: root.querySelector('#wf-next'),
        progressCopy: root.querySelector('#wf-progress-copy'),
        session: root.querySelector('#wf-session-chip')
      };

      el.footer = root.querySelector('.wf-nav');
      el.adminToggle = root.querySelector('#wf-admin-toggle');

      function currentCommunities() {
        const choices = state.admin && state.draftMapChoices ? state.draftMapChoices : state.mapChoices;
        return communityLayout.map(item => {
          if (!item.slot) return item;
          const options = cyoOptions[item.slot];
          const selected = options.find(option => option.id === choices[item.slot]) || options[0];
          return { ...selected, slot: item.slot, label: item.label, configurable: true };
        });
      }

      // The solved data identifies communities by grid station number, but that
      // number appears nowhere a participant can see — tiles carry names and the
      // grid is labelled by row and column. Always name them on screen.
      function stationName(n) {
        const community = currentCommunities()[n - 1];
        return community ? community.name : `community ${n}`;
      }

      function stationList(numbers) {
        const names = (numbers || []).map(stationName);
        if (names.length < 2) return names.join('');
        return `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
      }

      function noiseLabel(db) {
        if (db >= 65) return 'Loud';
        if (db >= 55) return 'Moderate';
        return 'Quiet';
      }

      function geographicGrid(cells) {
        const parts = ['<span class="wf-axis-corner" aria-hidden="true"></span>'];
        for (let col = 1; col <= 4; col += 1) parts.push(`<span class="wf-axis-label" aria-label="Column ${col}">${col}</span>`);
        cells.forEach((cell, index) => {
          if (index % 4 === 0) parts.push(`<span class="wf-axis-label" aria-label="Row ${Math.floor(index / 4) + 1}">${Math.floor(index / 4) + 1}</span>`);
          parts.push(cell);
        });
        return `<div class="wf-geogrid">${parts.join('')}</div>`;
      }


      function selectedFields() {
        const peak = state.timePattern === 'Peak exposure';
        return {
          added: peak ? 'pa' : 'aa',
          total: peak ? 'pt' : 'at',
          traffic: peak ? 'pc' : 'ac'
        };
      }

      function modeKey() {
        return state.count === 'People' ? 'people' : 'community';
      }

      function timeKey() {
        return state.timePattern === 'Peak exposure' ? 'peak' : 'avg';
      }

      function priorityKey() {
        const match = priorityOptions.find(option => option.label === state.priority);
        return match ? match.key : 'low_income';
      }

      function comboKey() {
        const s2 = state.mapChoices.cyo2 === 'new_density' ? 65 : 55;
        const s6 = state.mapChoices.cyo3 === 'international' ? 55 : 45;
        return `s2-${s2}_s6-${s6}`;
      }

      // The solved dataset indexes Create-Your-Own picks as one bit per slot in
      // station order (st2, st6, st11, st13), option 0 first.
      function cyoSelectionCode() {
        return ['cyo2', 'cyo3', 'cyo1', 'cyo4'].map(slot => {
          const index = cyoOptions[slot].findIndex(option => option.id === state.mapChoices[slot]);
          return index < 0 ? 0 : index;
        }).join('');
      }

      function resultFor(key = state.principle) {
        const mode = modeKey();
        const combo = comboKey();
        // One solve feeds both the average and the peak reading, so `equal` and
        // `sufficientarian` are not keyed by time pattern.
        if (key === 'equal') return dashboardData.equal[combo][mode][state.equalLimit.replace(' dB', '')];
        if (key === 'utilitarian') return dashboardData.utilitarian[combo][mode][timeKey()];
        if (key === 'sufficientarian') return dashboardData.sufficientarian[combo][mode][state.sufficientLimit.replace(' dB', '')];
        if (key === 'prioritarian') {
          if (state.priorityCyo) {
            const variant = dashboardData.cyoSelectionMap[cyoSelectionCode()][mode][priorityKey()];
            return dashboardData.prioritarianCyo[combo][mode][variant];
          }
          return dashboardData.prioritarian[combo][mode][priorityKey()];
        }
        return null;
      }

      function hasZones(result) {
        return Boolean(result && !result.unavailable && result.zones);
      }

      function valuesFor(key = state.principle) {
        const fields = selectedFields();
        return resultFor(key).zones.map(row => row[fields.added]);
      }

      function heatPercent(value, max = 12) {
        return `${Math.round(5 + Math.min(value / Math.max(max, 1), 1) * 79)}%`;
      }

      function fmtDb(v) {
        return String(Math.round(v));
      }

      function fmtAc(v) {
        return v.toFixed(1);
      }

      function baselineClass(db) {
        if (db >= 65) return 'baseline-loud';
        if (db >= 55) return 'baseline-moderate';
        return 'baseline-quiet';
      }

      function assumptionsStrip() {
        return `<div class="wf-rule-strip wf-assumptions" aria-label="Simulation assumptions">
          <span class="text-small text-muted">Today's assumptions</span>
          <div class="wf-rule-sentence" style="margin-top:4px">${assumptions.travelers} · ${assumptions.taxi} · ${assumptions.metro} · <strong>${assumptions.flights}</strong>.</div>
          <div class="text-small text-muted" style="margin-top:4px">Almost every plan below distributes the noise from these same flights, changing only the routes. The exceptions are the few rules that no routing can satisfy at full service; those are solved with a smaller fleet and are labelled with the demand they serve.</div>
        </div>`;
      }

      function resultFacts() {
        const result = resultFor();
        const meta = result.meta;
        const demandPercent = meta.demandPct != null && Number.isInteger(meta.demandPct) ? meta.demandPct : meta.demandPct.toFixed(1);
        let settingLabel = 'Fairness approach';
        let settingValue = principleLabels[state.principle];
        let detailCard = '';
        if (state.principle === 'equal') {
          settingLabel = state.timePattern === 'Peak exposure' ? 'Rule: maximum peak difference' : 'Rule: maximum noise difference';
          settingValue = state.equalLimit;
          // The cap is a constraint the routing was solved under, not a target it
          // aims at, so the honest companion figure is the spread that resulted.
          const added = valuesFor();
          const spread = Math.max(...added) - Math.min(...added);
          detailCard = `<div class="wf-fact"><span class="text-small text-muted">Spread that resulted</span><strong>${spread.toFixed(2)} dB</strong></div>`;
        } else if (state.principle === 'utilitarian') {
          settingLabel = 'Noise view';
          settingValue = state.timePattern;
          detailCard = `<div class="wf-fact"><span class="text-small text-muted">Highest added noise allowed</span><strong>${meta.D_used.toFixed(2)} dB</strong></div>`;
        } else if (state.principle === 'sufficientarian') {
          settingLabel = 'Rule: maximum added noise';
          settingValue = state.sufficientLimit;
          const peak = Math.max(...resultFor().zones.map(row => row.pa));
          detailCard = `<div class="wf-fact"><span class="text-small text-muted">Loudest peak that resulted</span><strong>${peak.toFixed(2)} dB</strong></div>`;
        } else {
          settingLabel = 'Priority';
          settingValue = state.priority;
          detailCard = `<div class="wf-fact"><span class="text-small text-muted">Added noise for the priority group</span><strong>${meta.protectedNoise.toFixed(2)} dB</strong></div>`;
        }
        const tt = result.travelTime;
        const travelPct = tt ? Math.round((tt.avg / 3 - 1) * 100) : 0;
        const travelCard = tt ? `<div class="wf-fact"><span class="text-small text-muted">Avg. trip vs. most direct route</span><strong>${travelPct <= 0 ? 'Most direct' : `+${travelPct}% longer`}</strong></div>` : '';
        const totalField = selectedFields().total;
        const zonesArr = result.zones;
        const avgTotal = zonesArr.reduce((sum, z) => sum + z[totalField], 0) / zonesArr.length;
        return `<div class="wf-scenario-facts" aria-label="Plan summary">
          <div class="wf-fact"><span class="text-small text-muted">Modeled demand served</span><strong>${demandPercent}%</strong></div>
          <div class="wf-fact"><span class="text-small text-muted">Avg. total noise across communities</span><strong>${fmtDb(avgTotal)} dB</strong></div>
          ${travelCard}
          <div class="wf-fact"><span class="text-small text-muted">${settingLabel}</span><strong>${settingValue}</strong></div>
          ${detailCard}
        </div>`;
      }

      function notice(title, body, alert = false) {
        return `<div class="wf-notice${alert ? ' is-alert' : ''}">
          <span class="wf-notice-title">${title}</span>
          <span class="text-small">${body}</span>
        </div>`;
      }

      // Everything a participant could otherwise walk away believing wrongly.
      // Each entry is tied to a field the build step carried through from the
      // CSV preamble, so these appear only where the data actually says so.
      function resultNotices() {
        const result = resultFor();
        const meta = result.meta;
        const out = [];

        if (meta.demandPct != null && meta.demandPct < 100) {
          out.push(notice(
            `This rule can only be met by cutting service to ${meta.demandPct}% of demand`,
            `At full demand there is no routing that satisfies this rule at all — the model proved it impossible, not merely slow. The fleet was reduced until a routing existed. <strong>Here the lost service is the cost of the rule</strong>, and it is a real result worth discussing.`,
            true));
        }

        if (state.principle === 'sufficientarian') {
          out.push(notice(
            'The maximum is a ceiling, not a goal',
            `The routing is only required to stay under ${state.sufficientLimit}; nothing rewards it for going quieter, and the objective it does minimise is travel, not noise. So these values can sit right against the ceiling. Measured on this map: raising the ceiling from 8 dB to 18 dB let the model buy one timestep of faster travel by pushing the loudest community from <strong>+7.78 dB to +14.77 dB</strong>. <strong>A looser rule licensed a louder answer.</strong>`,
            true));
          if (state.sufficientLimit === '18 dB') {
            out.push(notice(
              'At 18 dB this rule is doing nothing',
              'With every aircraft at 45 dB, the loudest any community on this map can physically become is +17.56 dB. An 18 dB ceiling can never be reached, so it constrains nothing — the routing you see is whatever the travel objective produced on its own.'));
          }
        }

        if (state.principle === 'equal' && meta.substituted) {
          out.push(notice(
            'This result was not solved with the “People” objective',
            'The optimiser could not finish the People solve for this cell, so the Communities routing is shown in its place. It is a defensible stand-in — every other loose-cap pair that did solve came out identical across the two — but <strong>it is not evidence that counting people produces this answer.</strong> Switching Who counts here shows you the same solve twice.',
            true));
        }

        if (state.principle === 'prioritarian') {
          const noPurchase = notice(
            'This priority group changed nothing',
            `Added noise across the protected communities came to <strong>0.00 dB</strong> — every one of them sits off the only corridor the aircraft can use, so the rule was already satisfied before the model started. The routing shown is one of many that tie; a different pick of this priority group would look different on screen while protecting exactly as much. <strong>Treat this as “the rule had no purchase here”, not as a plan that worked.</strong>`,
            true);

          // With Create-Your-Own counted, 0.00 dB is ambiguous: it can mean the
          // rule bit on nothing, or that the model rerouted clear of the group
          // altogether. Those are opposites, so read the classification, not the
          // number.
          if (!state.priorityCyo) {
            if (meta.degenerate) out.push(noPurchase);
          } else if (meta.effect === 'no-op') {
            out.push(noPurchase);
          } else if (meta.effect === 'succeeded') {
            out.push(notice(
              'The priority rule worked here',
              `Added noise across the protected communities came to <strong>0.00 dB</strong> — but unlike the fixed-communities version, this is an achievement rather than an accident. The model rerouted traffic clear of the priority group entirely${meta.gainedOnPath && meta.gainedOnPath.length ? `, after ${stationList(meta.gainedOnPath)} joined the group through a map choice and landed on the corridor every aircraft must cross` : ''}. Compare the flight paths against the same setting with this box unchecked, and look at what the rerouting cost in travel time.`));
          } else if (meta.effect === 'traded') {
            out.push(notice(
              'The priority rule moved traffic, but could not clear the group',
              `The model rerouted aircraft to protect this group and still could not get its added noise to zero — <strong>${meta.protectedNoise.toFixed(2)} dB remains</strong>. Somebody in the group is unavoidably under a flight path. This is the rule doing as much as the map allows.`));
          } else if (meta.effect === 'forced') {
            out.push(notice(
              'This number is a cost charged, not a choice made',
              `The priority group carries <strong>${meta.protectedNoise.toFixed(2)} dB</strong> of added noise, but the routing is identical to the one the model picks with no priority rule at all. Nothing was rerouted — the figure records burden the group was always going to take, so do not read it as the rule having acted.`,
              true));
          }
          if (meta.routingForcedByT) {
            out.push(notice(
              'The routing here is forced, not chosen',
              `This solve runs at ${meta.T} timesteps, where exactly one path from Downtown to the Airport exists. The model had no alternative to choose between, so the routing cannot be read as something the priority rule decided. Changing the priority group changes the reported number but cannot move an aircraft.`));
          }
          if (state.timePattern === 'Average exposure') {
            out.push(notice(
              'Average values are not comparable across “Who counts” here',
              'The People and Communities solves for this principle run over different numbers of timesteps, and the average spreads noise across however many there are. Identical physical routings therefore read as different averages. <strong>Compare the two on Peak exposure, not Average.</strong>'));
          }
          if (state.priorityCyo && state.count === 'People') {
            out.push(notice(
              'Create-Your-Own picks cannot change this result',
              'In People mode the routing is forced by the shorter time budget, so adding a Create-Your-Own community to the priority group changes the protected-noise figure but moves no aircraft. Switch Who counts to Communities to see the picks actually reroute traffic.'));
          }
          if (state.priorityCyo && meta.effect !== 'succeeded' && meta.gainedOnPath && meta.gainedOnPath.length) {
            out.push(notice(
              'A Create-Your-Own pick landed on the flight corridor',
              `${stationList(meta.gainedOnPath)} joined this priority group through a Create-Your-Own choice, and sits on the corridor every aircraft must cross. Create Your Own 3 and 1 are the two slots that can do this — <strong>whether a map choice has any teeth at all depends on whether it lands on the corridor.</strong>`));
          }
        }

        return out.length ? `<div class="wf-notices">${out.join('')}</div>` : '';
      }


      function lockedStrip() {
        return `<div class="wf-lock-strip" aria-label="Locked evaluation choices">
          <span class="viz-badge wf-chip-data">Starting noise: Community Card levels</span>
          <span class="viz-badge">Who counts: ${state.count}</span>
          <span class="viz-badge">Noise pattern: ${state.timePattern}</span>
          <span class="viz-badge">Vertiports: Downtown + Airport</span>
        </div>`;
      }

      function ruleSentence(key = state.principle) {
        if (key === 'equal') return `Keep the difference in added noise within ${state.equalLimit} across ${state.count.toLowerCase()}.`;
        if (key === 'utilitarian') return `Minimize the overall ${state.timePattern.toLowerCase()} noise across ${state.count.toLowerCase()}.`;
        if (key === 'sufficientarian') return `Keep every community’s peak added noise at or below ${state.sufficientLimit}.`;
        if (key === 'proportional') return `Relate each community’s added noise to the practical benefit it can receive — which this map cannot do.`;
        return `Give additional protection to communities with the selected priority: ${state.priority}${state.priorityCyo ? ', including any Create-Your-Own community that meets it' : ', among the twelve fixed communities'}.`;
      }

      function detailsPane(kind) {
        const i = state.selected;
        if (i == null) return `<aside class="wf-details is-empty text-small text-muted">Click a community on the map to see its details.</aside>`;
        const c = currentCommunities()[i];
        let body = `<div class="wf-fact"><span class="text-small text-muted">Starting sound level</span><strong>${noiseLabel(c.base)} · ${fmtDb(c.base)} dB</strong></div>`;
        if (kind === 'result' && !c.vertiport) {
          const row = resultFor().zones[i];
          const values = valuesFor();
          const isMax = row[selectedFields().added] === Math.max(...values);
          body += `<div class="wf-fact"><span class="text-small text-muted">Added UAM noise · average</span><strong>+${fmtDb(row.aa)} dB</strong></div>
            <div class="wf-fact"><span class="text-small text-muted">Total resulting noise · average</span><strong>${fmtDb(row.at)} dB</strong></div>
            <div class="wf-fact"><span class="text-small text-muted">Added UAM noise · peak</span><strong>+${fmtDb(row.pa)} dB</strong></div>
            <div class="wf-fact"><span class="text-small text-muted">Total resulting noise · peak</span><strong>${fmtDb(row.pt)} dB</strong></div>
            <div class="wf-fact"><span class="text-small text-muted">Avg. aircraft overhead</span><strong>${fmtAc(row.ac)}</strong></div>
            <div class="wf-fact"><span class="text-small text-muted">Max aircraft overhead</span><strong>${row.pc.toFixed(0)}</strong></div>`;
          if (state.principle === 'prioritarian' && (resultFor().meta.protected || []).includes(i + 1)) body += `<div class="wf-fact"><span class="text-small text-muted">Status</span><strong>Priority group${(resultFor().meta.gainedFromCyo || []).includes(i + 1) ? ' · joined by map choice' : ''}</strong></div>`;
        }
        const info = communityDetails[c.name];
        if (info) {
          body += `<span class="text-small text-muted wf-details-section">About this community</span>`;
          body += Object.entries(info).map(([label, value]) => `<div class="wf-fact"><span class="text-small text-muted">${label}</span><strong>${value}</strong></div>`).join('');
        }
        return `<aside class="wf-details" aria-label="Community details">
          <div class="wf-details-head"><strong>${c.name}</strong><button type="button" class="btn btn-ghost" data-close-details aria-label="Close details">✕</button></div>
          ${c.vertiport ? '<span class="viz-badge">Vertiport</span>' : ''}
          <div class="wf-details-facts">${body}</div>
        </aside>`;
      }

      function sharedMap() {
        const cells = currentCommunities().map((c, i) => `<div class="wf-community ${baselineClass(c.base)}${c.vertiport ? ' is-vertiport' : ''}${c.configurable ? ' is-configurable' : ''}${state.selected === i ? ' is-selected' : ''}" data-community="${i}">
              <span class="wf-tile-name">${c.name}</span>
              <div class="wf-before-after">${noiseLabel(c.base)} · ${fmtDb(c.base)} dB</div>
              <span class="wf-tile-meta">Starting sound level</span>
            </div>`);
        return `<div class="wf-map-frame">
          <div class="wf-map-context text-small">
            <span class="wf-vertiport-pair"><span class="wf-vertiport-dot"></span><strong>Two-way service between Downtown and Airport</strong></span>
            <span class="text-muted">Click any community to see its details.</span>
          </div>
          <div class="wf-noise-key text-small" aria-label="Community Card sound-level colors">
            <span class="wf-noise-key-item"><span class="wf-noise-swatch" style="--swatch:var(--community-loud)"></span>Loud · 65 dB</span>
            <span class="wf-noise-key-item"><span class="wf-noise-swatch" style="--swatch:var(--community-moderate)"></span>Moderate · 55 dB</span>
            <span class="wf-noise-key-item"><span class="wf-noise-swatch" style="--swatch:var(--community-quiet)"></span>Quiet · 45 dB</span>
            <span class="text-muted">Matches the Community Cards.</span>
          </div>
          <div class="wf-map-flex" style="margin-top:12px"><div class="wf-map-grid-col">${geographicGrid(cells)}</div>${detailsPane('shared')}</div>
        </div>`;
      }

      function resultMap(key = state.principle) {
        const fields = selectedFields();
        const result = resultFor(key);
        const values = valuesFor(key);
        const maxValue = Math.max(...values);
        const gradientValues = result.zones.map(row => state.comparison === 'Added UAM noise' ? row[fields.added] : row[fields.total] - 45);
        const maxGradientValue = Math.max(...gradientValues, 1);
        const aircraftLabel = state.timePattern === 'Average exposure' ? 'Avg. aircraft' : 'Max aircraft';
        const cells = currentCommunities().map((c, i) => {
              const row = result.zones[i];
              const added = row[fields.added];
              const after = row[fields.total];
              const traffic = row[fields.traffic];
              const aircraftValue = state.timePattern === 'Average exposure' ? fmtAc(traffic) : traffic.toFixed(0);
              const isMax = added === maxValue;
              const gradientValue = state.comparison === 'Added UAM noise' ? added : after - 45;
              if (c.vertiport) return `<div class="wf-community is-result is-vertiport${state.selected === i ? ' is-selected' : ''}" data-community="${i}">
                <span class="wf-tile-name">${c.name}</span>
              </div>`;
              const isProtected = state.principle === 'prioritarian' && (resultFor().meta.protected || []).includes(i + 1);
              return `<div class="wf-community is-result${c.configurable ? ' is-configurable' : ''}${isProtected ? ' is-protected' : ''}${state.selected === i ? ' is-selected' : ''}" data-community="${i}" style="--heat:${heatPercent(gradientValue, maxGradientValue)}">
                <span class="wf-tile-name">${c.name}</span>
                <div class="wf-before-after"><span class="wf-value">${fmtDb(c.base)}</span> → <span class="wf-value">${fmtDb(after)} dB</span></div>
                <div class="wf-added">+${fmtDb(added)} dB<span class="wf-added-detail">${aircraftLabel}: ${aircraftValue}</span></div>
                ${isProtected ? `<span class="wf-tile-meta">Priority group${(resultFor().meta.gainedFromCyo || []).includes(i + 1) ? ' · by map choice' : ''}</span>` : ''}
              </div>`;
            });
        return `<div class="wf-map-frame">
          <div class="wf-map-context text-small">
            <span class="wf-vertiport-pair"><span class="wf-vertiport-dot"></span><strong>Two fixed vertiports: Downtown and Airport</strong></span>
            <span class="text-muted">The values below show noise and aircraft over each community.</span>
          </div>
          <div class="wf-legend text-small">
            <label class="wf-paths-toggle"><input type="checkbox" id="wf-paths-toggle" ${state.showPaths ? 'checked' : ''}/> Show flight paths</label>
          </div>
          <div class="wf-map-flex" style="margin-top:12px"><div class="wf-map-grid-col"><div class="wf-grid-wrap">${geographicGrid(cells)}<svg class="wf-flight-overlay" aria-hidden="true"></svg></div>${routesFootnote()}</div>${detailsPane('result')}</div>
        </div>`;
      }

      // The best any full-service plan in this dataset manages for its loudest
      // community — measured across every solved result rather than asserted, so
      // it cannot drift away from the data it describes.
      const noiseFloor = (() => {
        let avg = Infinity;
        let peak = Infinity;
        const walk = node => {
          if (!node || typeof node !== 'object') return;
          if (node.zones) {
            if (node.meta && node.meta.demandPct === 100) {
              avg = Math.min(avg, Math.max(...node.zones.map(z => z.aa)));
              peak = Math.min(peak, Math.max(...node.zones.map(z => z.pa)));
            }
            return;
          }
          Object.values(node).forEach(walk);
        };
        ['equal', 'utilitarian', 'sufficientarian', 'prioritarian', 'prioritarianCyo'].forEach(k => walk(dashboardData[k]));
        return { avg, peak };
      })();

      function routesFootnote() {
        const routes = resultFor().routes;
        if (!routes || !state.showPaths) return '';
        return `<div class="text-small text-muted" style="margin-top:8px">Flight paths show this plan's actual routing from the solver. More dots on a corridor = more flights per hour on it. Every route must cross the same central corridor, so even the most direct trip passes over it — and across every plan in this study that serves full demand, the quietest any plan ever leaves its loudest community is <strong>+${noiseFloor.avg.toFixed(2)} dB on average and +${noiseFloor.peak.toFixed(2)} dB at peak</strong>. That floor comes from the shape of the map, not from any policy choice.</div>`;
      }

      function drawFlightOverlay() {
        const svg = root.querySelector('.wf-flight-overlay');
        if (!svg) return;
        const routes = resultFor().routes;
        if (!routes || !state.showPaths) { svg.innerHTML = ''; return; }
        const wrap = svg.parentElement;
        const wrapRect = wrap.getBoundingClientRect();
        svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
        const centers = {};
        wrap.querySelectorAll('[data-community]').forEach(tile => {
          const r = tile.getBoundingClientRect();
          centers[Number(tile.dataset.community) + 1] = [r.left - wrapRect.left + r.width / 2, r.top - wrapRect.top + r.height / 2];
        });
        const maxFlights = Math.max(...routes.map(r => r.flights), 1);
        let g = '';
        routes.forEach((route, i) => {
          const pts = route.path.map(s => centers[s]).filter(Boolean);
          if (pts.length < 2) return;
          const d = 'M' + pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
          g += `<path id="wf-corr-${i}" d="${d}" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.45"/>`;
          const dots = Math.max(1, Math.round(route.flights / 4));
          const dur = 6 + i * 1.3;
          for (let k = 0; k < dots; k++) {
            g += `<circle r="4" fill="var(--primary)" opacity="0.9"><animateMotion dur="${dur}s" repeatCount="indefinite" begin="${-(k * dur / dots).toFixed(2)}s"><mpath href="#wf-corr-${i}"/></animateMotion></circle>`;
            g += `<circle r="4" fill="var(--primary)" opacity="0.55"><animateMotion dur="${dur}s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" begin="${-(k * dur / dots + dur / 2).toFixed(2)}s"><mpath href="#wf-corr-${i}"/></animateMotion></circle>`;
          }
          const mid = pts[Math.floor(pts.length / 2)];
          g += `<rect x="${mid[0] - 17}" y="${mid[1] - 10}" width="34" height="18" rx="9" fill="var(--popover)" stroke="var(--border)" opacity="0.95"/>
                <text x="${mid[0]}" y="${mid[1] + 3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--primary)">${route.flights}/hr</text>`;
        });
        svg.innerHTML = g;
      }


      function adminOptionField(slot, label) {
        const options = cyoOptions[slot];
        const draftChoice = state.draftMapChoices ? state.draftMapChoices[slot] : state.mapChoices[slot];
        const helper = {
          cyo1: 'Starting noise and population weight stay fixed either way. Under Prioritarian with Create-Your-Own counted, this choice can add community 11 to a priority group — and 11 sits on the flight corridor, so it can genuinely reroute traffic.',
          cyo2: 'Switches the solved dataset: New High-Density starts at 65 dB, Historic Black at 55 dB. Also changes which priority groups community 2 belongs to.',
          cyo3: 'Switches the solved dataset: International starts at 55 dB, Exurban at 45 dB. Community 6 is on the flight corridor, and these two options put it in different priority groups — the most consequential choice on this screen.',
          cyo4: 'Starting noise and population weight stay fixed either way. Under Prioritarian with Create-Your-Own counted, this choice changes which priority groups community 13 belongs to; 13 is off the corridor, so the effect is small.'
        }[slot];
        return `<label class="wf-field">
          <span>${label}</span>
          <select class="form-select" data-admin-slot="${slot}">
            ${options.map(option => `<option value="${option.id}" ${draftChoice === option.id ? 'selected' : ''}>${option.name} — ${noiseLabel(option.base)} ${option.base} dB</option>`).join('')}
          </select>
          <span class="text-small text-muted">${helper}</span>
        </label>`;
      }

      function renderAdmin() {
        return `<div class="wf-stack">
          <div class="wf-field">
            <span>Participant map status</span>
            <div class="wf-success">${state.adminDirty ? 'Draft changes — not visible to groups yet' : 'Locked — every group sees this map'}</div>
          </div>
          <div class="wf-panel">
            <div class="wf-result-summary">
              <div>
                <span class="text-small text-muted">Configurable positions</span>
                <div class="wf-rule-sentence">Choose one community for each “Create Your Own” location.</div>
              </div>
              <span class="viz-badge">Admin only</span>
            </div>
            <div class="wf-admin-grid" style="margin-top:14px">
              ${adminOptionField('cyo1', 'Create Your Own 1 · Row 3, Column 3')}
              ${adminOptionField('cyo2', 'Create Your Own 2 · Row 1, Column 2')}
              ${adminOptionField('cyo3', 'Create Your Own 3 · Row 2, Column 2')}
              ${adminOptionField('cyo4', 'Create Your Own 4 · Row 4, Column 1')}
            </div>
          </div>
          <div class="wf-warning">Create Your Own 2 and 3 switch which solved dataset is shown, because their two options start at different noise levels. All four slots also change which priority groups their community belongs to, which matters under Prioritarian once “Count Create-Your-Own communities too” is on — most of all for slots 3 and 1, whose communities sit on the flight corridor.</div>
          <div class="wf-rule-strip">
            <span class="text-small text-muted">Preview</span>
            <div class="wf-rule-sentence">The participant map is always displayed as the same numbered 4 × 4 grid.</div>
          </div>
          ${sharedMap()}
        </div>`;
      }

      function renderSession() {
        return `<div class="wf-stage-card">
          <div class="wf-form-grid">
            <label class="wf-field wf-session-field">
              <span>Group ID</span>
              <input class="form-control" id="wf-group" value="${state.group}" aria-describedby="wf-group-help" />
              <span class="text-small text-muted" id="wf-group-help">Use the ID assigned to your table.</span>
            </label>
          </div>
        </div>`;
      }

      function renderSharedMap() {
        return `<div class="wf-stack">
          ${sharedMap()}
        </div>`;
      }


      function choiceCard(group, value, title, copy, selected, available = true) {
        return `<button type="button" class="wf-option${selected ? ' is-selected' : ''}" data-choice-group="${group}" data-choice="${value}" aria-pressed="${selected}" ${available ? '' : 'disabled'}>
          <span class="viz-badge">${available ? (selected ? 'Selected' : 'Choose') : 'Next data integration'}</span>
          <div class="wf-option-title">${title}</div>
          <div class="wf-option-copy">${copy}</div>
        </button>`;
      }

      function renderMeasure() {
        return `<div class="wf-stack">
          <div class="wf-panel">
            <span class="text-small text-muted">Who counts?</span>
            <div class="wf-grid-2" style="margin-top:10px">
              ${choiceCard('count', 'Communities', 'Communities', 'Every community counts equally, no matter how many people live there.', state.count === 'Communities')}
              ${choiceCard('count', 'People', 'People', 'Communities where more people live count more toward the result.', state.count === 'People')}
            </div>
            <div class="wf-notice" style="margin-top:12px">
              <span class="wf-notice-title">Switching this does not always give you a like-for-like comparison</span>
              <span class="text-small">Under the Prioritarian principle the two options had to be solved over different numbers of timesteps, which changes what an average means without changing where anything flies. <strong>Compare those two results on Peak exposure rather than Average.</strong> In a few places the People solve could not be completed at all, and the dashboard says so where that happens.</span>
            </div>
          </div>
          <div class="wf-panel">
            <span class="text-small text-muted">Which noise pattern?</span>
            <div class="wf-grid-2" style="margin-top:10px">
              ${choiceCard('timePattern', 'Average exposure', 'Average exposure', 'What happens across the whole period; repeated noise keeps it elevated.', state.timePattern === 'Average exposure')}
              ${choiceCard('timePattern', 'Peak exposure', 'Peak exposure', 'The loudest single moment, even if the rest of the period is quiet.', state.timePattern === 'Peak exposure')}
            </div>
          </div>
          <div class="text-small text-muted">The result maps always show both the change in noise and the total resulting noise for every community.</div>
          ${lockedStrip()}
        </div>`;
      }

      function ruleControl() {
        if (state.principle === 'equal') return `<label class="wf-field"><span>${state.timePattern === 'Peak exposure' ? 'Maximum peak difference' : 'Maximum allowed difference'}</span><select class="form-select" id="wf-rule-select"><option ${state.equalLimit === '3 dB' ? 'selected' : ''}>3 dB</option><option ${state.equalLimit === '8 dB' ? 'selected' : ''}>8 dB</option><option ${state.equalLimit === '18 dB' ? 'selected' : ''}>18 dB</option></select></label>`;
        if (state.principle === 'utilitarian') return `<div class="wf-success">Nothing to choose for this principle. The dashboard shows the routing result that minimizes the overall noise objective.</div>`;
        if (state.principle === 'proportional') return `<div class="wf-success">Nothing to choose for this principle — it could not be carried out on this map at all. The panel on the right explains why.</div>`;
        if (state.principle === 'sufficientarian') return `<label class="wf-field"><span>Group maximum acceptable modeled increase</span><select class="form-select" id="wf-rule-select">${['3 dB', '8 dB', '18 dB'].map(limit => `<option ${state.sufficientLimit === limit ? 'selected' : ''}>${limit}</option>`).join('')}</select></label>`;
        return `<label class="wf-field"><span>Priority to protect</span>
          <select class="form-select" id="wf-rule-select">${priorityOptions.map(option => `<option ${state.priority === option.label ? 'selected' : ''}>${option.label}</option>`).join('')}</select>
        </label>
        <label class="wf-paths-toggle" style="margin-top:12px">
          <input type="checkbox" id="wf-priority-cyo" ${state.priorityCyo ? 'checked' : ''}/> Count Create-Your-Own communities too
        </label>
        <span class="text-small text-muted">Off, the priority group is drawn only from the twelve fixed communities, so nobody’s map choices can move it. On, a Create-Your-Own community joins the group whenever it meets the condition — and two of those slots sit on the flight corridor.</span>`;
      }

      function resultsPrincipleSwitcher() {
        return `<div class="wf-panel">
          <span class="wf-control-heading">Fairness principle</span>
          <span class="text-small text-muted">Choose a principle to update the result.</span>
          <div class="wf-results-principles">
            ${Object.keys(principleLabels).map(key => `<button type="button" class="btn ${state.principle === key ? 'btn-primary' : 'btn-ghost'}" data-principle="${key}" aria-pressed="${state.principle === key}">${principleLabels[key]}</button>`).join('')}
          </div>
        </div>`;
      }

      function resultControlPane() {
        const guidance = principleGuidance[state.principle];
        const availability = '';
        return `<aside class="wf-results-controls" aria-label="Result controls">
          ${resultsPrincipleSwitcher()}
          <div class="wf-panel">${ruleControl()}</div>
          <div class="wf-rule-strip">
            <span class="text-small text-muted">${principleLabels[state.principle]} · Definition</span>
            <div class="wf-rule-sentence" style="margin-top:6px">${guidance.goal}</div>
            <div class="text-small text-muted" style="margin-top:8px">What makes it difficult? ${guidance.tradeoff}</div>
          </div>
          <div class="wf-rule-strip">
            <span class="text-small text-muted">Active rule</span>
            <div class="wf-rule-sentence" style="margin-top:6px">${ruleSentence()}</div>
          </div>
          ${availability}
        </aside>`;
      }

      // Twelve (combo x setting) cells have no result because the optimiser ran
      // out of time. Phase one proved a full-demand routing exists in each, so
      // this is a limit of the solver and must never be read as infeasibility,
      // as unfairness, or as a limit on service.
      function unavailablePanel(result) {
        return `<div class="wf-empty-result" role="status">
          <span class="viz-badge">No result for this setting</span>
          <h4>This combination takes too long to solve.</h4>
          <p class="text-small">${result.reason}</p>
          <p class="text-small text-muted">Budget spent before giving up: ${result.budget}. Every attempt failed within a few percent of whatever budget it was given, across different random seeds and time limits — so the model is not slowly converging, and more hours would not produce an answer. Resolving it needs a different formulation of the objective, not a faster computer.</p>
          <p class="text-small text-muted">Nothing has been substituted in its place. Change the setting, the principle, or the map to see a result that was actually solved.</p>
        </div>`;
      }

      // Proportional was built, run and measured before being rejected. The
      // absence is a finding about the network, so it gets stated rather than
      // quietly dropped from the switcher.
      function proportionalPanel() {
        return `<div class="wf-empty-result" role="status">
          <span class="viz-badge">Not possible on this map</span>
          <h4>Burden cannot be made to follow benefit here.</h4>
          <p class="text-small">This principle was implemented and run before being set aside. The benefit rule gave most to the vertiports, then to their well-off neighbours, and least to communities further out. The routing could not reflect that ordering under any weighting tried, in any of the four map configurations.</p>
          <p class="text-small text-muted">Two structural reasons, both measured:</p>
          <p class="text-small text-muted"><strong>The benefited neighbours get no traffic.</strong> ${stationList([2, 5])} sit next to Downtown, so the rule grants them benefit — but they are not on the path anything flies. They received <strong>exactly 0.00 dB of added noise in every scheme tried</strong>. A community can be given a large benefit score and still be impossible to burden.</p>
          <p class="text-small text-muted"><strong>The corridor communities cannot be told apart.</strong> ${stationList([6, 11])} are consecutive stops on the one shortest path, so every aircraft crosses both exactly once. Their traffic is equal by construction, and any difference in their added noise comes from how loud they already were, not from how much they fly.</p>
          <p class="text-small"><strong>With two vertiports and one corridor between them, there is no routing freedom left to express a benefit ordering with.</strong> That is a fact about this network, not a missing dataset — and it is worth discussing as a result in its own right.</p>
        </div>`;
      }

      function renderReveal() {
        const result = resultFor();
        let main;
        if (state.principle === 'proportional') main = proportionalPanel();
        else if (result.unavailable) main = unavailablePanel(result);
        else main = `${resultFacts()}${resultMap()}${resultNotices()}`;
        return `<div class="wf-stack">
          ${lockedStrip()}
          <div class="wf-results-layout">
            ${resultControlPane()}
            <div class="wf-results-main">${main}</div>
          </div>
        </div>`;
      }


      function bindScreenInteractions() {
        const workshopId = root.querySelector('#wf-workshop-id');
        if (workshopId) workshopId.addEventListener('input', e => { state.workshopId = e.target.value; });
        root.querySelectorAll('[data-admin-slot]').forEach(select => select.addEventListener('change', () => {
          state.draftMapChoices[select.dataset.adminSlot] = select.value;
          state.adminDirty = true;
          state.saved = false;
          render();
        }));

        const groupInput = root.querySelector('#wf-group');
        const facilitatorInput = root.querySelector('#wf-facilitator');
        if (groupInput) groupInput.addEventListener('input', e => { state.group = e.target.value; updateSessionChip(); });
        if (facilitatorInput) facilitatorInput.addEventListener('input', e => { state.facilitator = e.target.value; });

        root.querySelectorAll('[data-choice-group]').forEach(button => button.addEventListener('click', () => {
          state[button.dataset.choiceGroup] = button.dataset.choice;
          state.saved = false;
          render();
        }));

        root.querySelectorAll('[data-principle]').forEach(button => button.addEventListener('click', () => {
          state.principle = button.dataset.principle;
          state.saved = false;
          render();
        }));

        root.querySelectorAll('[data-community]').forEach(tile => tile.addEventListener('click', () => {
          const index = Number(tile.dataset.community);
          state.selected = state.selected === index ? null : index;
          render();
        }));
        const closeDetails = root.querySelector('[data-close-details]');
        if (closeDetails) closeDetails.addEventListener('click', () => { state.selected = null; render(); });

        const pathsToggle = root.querySelector('#wf-paths-toggle');
        if (pathsToggle) pathsToggle.addEventListener('change', e => { state.showPaths = e.target.checked; render(); });

        const priorityCyo = root.querySelector('#wf-priority-cyo');
        if (priorityCyo) priorityCyo.addEventListener('change', e => { state.priorityCyo = e.target.checked; state.saved = false; render(); });

        const ruleSelect = root.querySelector('#wf-rule-select');
        if (ruleSelect) ruleSelect.addEventListener('change', e => {
          if (state.principle === 'equal') state.equalLimit = e.target.value;
          if (state.principle === 'sufficientarian') state.sufficientLimit = e.target.value;
          if (state.principle === 'prioritarian') state.priority = e.target.value;
          state.saved = false;
          render();
        });

        const save = root.querySelector('#wf-save-plan');
        if (save) save.addEventListener('click', () => { state.saved = true; render(); });
      }

      function updateSessionChip() {
        if (state.admin) {
          el.session.textContent = state.adminDirty ? 'Admin · Unsaved changes' : 'Admin · Map locked';
          return;
        }
        el.session.textContent = state.group.trim() ? `Group ${state.group.trim()} · ${steps[state.step].label}` : 'Group session not started';
      }

      function renderSteps() {
        el.steps.innerHTML = steps.map((step, i) => `<button type="button" class="btn wf-step ${i === state.step ? 'btn-primary' : 'btn-ghost'}" data-step="${i}" aria-current="${i === state.step ? 'step' : 'false'}"><span class="wf-step-number">${i + 1}</span><span>${step.label}</span></button>`).join('');
        el.steps.querySelectorAll('[data-step]').forEach(button => button.addEventListener('click', () => { state.step = Number(button.dataset.step); render(); }));
      }

      function render() {
        if (state.admin) {
          el.steps.hidden = true;
          el.kicker.textContent = 'Facilitator-only view';
          el.title.textContent = 'Configure the shared 4 × 4 community map';
          el.copy.textContent = 'Set the four configurable communities once, preview their exact geographic positions, and lock the configuration for every participant group.';
          el.badge.textContent = state.adminDirty ? 'Unsaved changes' : 'Map locked';
          el.back.disabled = false;
          el.back.textContent = 'Cancel';
          el.next.textContent = 'Save and lock map';
          el.progressCopy.textContent = 'These controls do not appear in participant sessions.';
          el.screen.innerHTML = renderAdmin();
          bindScreenInteractions();
          updateSessionChip();
          el.adminToggle.textContent = 'Return to participant view';
          return;
        }

        el.steps.hidden = false;
        el.back.textContent = 'Back';
        el.adminToggle.textContent = 'Admin setup';
        const current = steps[state.step];
        renderSteps();
        el.kicker.textContent = `Step ${state.step + 1} of ${steps.length}`;
        el.title.textContent = current.title;
        el.copy.textContent = current.copy;
        el.badge.textContent = current.badge;
        el.back.disabled = state.step === 0;
        el.next.textContent = state.step === steps.length - 1 ? 'Return to start' : state.step === 2 ? 'View results' : 'Continue';
        el.progressCopy.textContent = state.step === steps.length - 1 ? 'Explore each principle, then record your group’s read on the worksheet.' : 'Use the controls or jump between steps above.';

        const screens = [renderSession, renderSharedMap, renderMeasure, renderReveal];
        el.screen.innerHTML = assumptionsStrip() + screens[state.step]();
        bindScreenInteractions();
        updateSessionChip();
        drawFlightOverlay();
      }

      el.back.addEventListener('click', () => {
        if (state.admin) { state.admin = false; state.adminDirty = false; state.draftMapChoices = null; render(); return; }
        if (state.step > 0) { state.step -= 1; render(); }
      });
      el.next.addEventListener('click', () => {
        if (state.admin) {
          state.mapChoices = { ...(state.draftMapChoices || state.mapChoices) };
          state.mapLocked = true;
          state.adminDirty = false;
          state.draftMapChoices = null;
          state.admin = false;
          render();
          return;
        }
        if (state.step === steps.length - 1) state.step = 0;
        else state.step += 1;
        render();
      });

      el.adminToggle.addEventListener('click', () => {
        if (!state.admin) {
          state.draftMapChoices = { ...state.mapChoices };
          state.adminDirty = false;
          state.admin = true;
        } else {
          state.admin = false;
          state.adminDirty = false;
          state.draftMapChoices = null;
        }
        render();
      });

      render();
    })();
  </script>
</div>
